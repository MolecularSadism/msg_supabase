[package]
name = "msg_supabase"
version = "0.3.0"
edition = "2024"
description = "A flexible Bevy plugin for syncing game data to Supabase with configurable insert/update modes"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MolecularSadism/msg_supabase"
keywords = ["bevy", "supabase", "database", "sync", "gamedev"]
categories = ["game-engines", "web-programming::http-client"]

[dependencies]
bevy = { version = "0.18", default-features = false, features = ["bevy_log"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ehttp = "0.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bevy_lint)"] }

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "delta"
harness = false
